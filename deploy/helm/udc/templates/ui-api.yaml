{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" . }}-ui-api
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-api
spec:
  replicas: {{ .Values.uiApi.replicas }}
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: ui-api
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: ui-api
    spec:
      containers:
        - name: ui-api
          image: "{{ .Values.uiApi.image.repository }}:{{ .Values.uiApi.image.tag }}"
          imagePullPolicy: {{ .Values.uiApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: NODE_ENV
              value: production
            - name: UI_DB_HOST
              value: {{ include "udc.dbHost" . | quote }}
            - name: UI_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: UI_DB_NAME
              value: {{ .Values.uiApi.dbName | quote }}
            - name: UI_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: UI_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: db-password } }
            - name: UI_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: ui-jwt-secret } }
            - name: UI_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: ui-encryption-key } }
            - name: UI_ADMIN_USER
              value: {{ .Values.uiApi.adminUser | quote }}
            - name: UI_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: ui-admin-password } }
            # This release's UDC, registered on the first start
            - name: UDC_DEFAULT_NAME
              value: {{ .Release.Name | quote }}
            - name: UDC_DEFAULT_URL
              value: "http://{{ include "udc.fullname" . }}-backend:{{ .Values.service.backendPort }}"
            - name: UDC_DEFAULT_KEY
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: service-key } }
            {{- $public := .Values.uiApi.udcPublicUrl | default (ternary (printf "https://%s" .Values.ingress.apiHost) "" (and .Values.ingress.enabled (ne .Values.ingress.apiHost ""))) }}
            {{- if $public }}
            - name: UDC_DEFAULT_PUBLIC_URL
              value: {{ $public | quote }}
            {{- end }}
            {{- with .Values.uiApi.keycloak }}
            {{- if .url }}
            - name: KEYCLOAK_URL
              value: {{ .url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .realm | quote }}
            - name: KEYCLOAK_CLIENT
              value: {{ .clientId | quote }}
            - name: KEYCLOAK_UI_CLIENT
              value: {{ .uiClientId | default .clientId | quote }}
            - name: KEYCLOAK_AUTHORIZED_ROLE
              value: {{ .authorizedRole | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/v1/basic/health, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.uiApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-ui-api
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: ui-api
  ports:
    - name: http
      port: {{ .Values.service.uiApiPort }}
      targetPort: http
{{- end }}
