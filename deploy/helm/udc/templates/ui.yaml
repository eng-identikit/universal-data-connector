{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" . }}-ui
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            # nginx proxies /api (and the instances' streams) to the orchestrator API
            - name: UI_API_BACKEND
              value: "{{ include "udc.fullname" . }}-ui-api:{{ .Values.service.uiApiPort }}"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-ui
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: {{ .Values.service.uiPort }}
      targetPort: http
{{- end }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "udc.fullname" . }}
  labels: {{- include "udc.labels" . | nindent 4 }}
  annotations:
    # Long-lived WebSocket connections (realtime streams)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # host: the orchestrator UI (which proxies /api to ui-api); without the UI, the UDC API
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "udc.fullname" . }}-{{ if .Values.ui.enabled }}ui{{ else }}backend{{ end }}
                port: { number: {{ if .Values.ui.enabled }}{{ .Values.service.uiPort }}{{ else }}{{ .Values.service.backendPort }}{{ end }} }
    {{- if and .Values.ui.enabled .Values.ingress.apiHost }}
    # apiHost: the UDC API for devices, scripts and MCP clients
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "udc.fullname" . }}-backend
                port: { number: {{ .Values.service.backendPort }} }
    {{- end }}
{{- end }}
