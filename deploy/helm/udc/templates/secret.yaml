{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udc.fullname" . }}-secrets
  labels: {{- include "udc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ include "udc.secretValue" (dict "ctx" . "key" "jwt-secret" "value" .Values.auth.jwtSecret) | quote }}
  admin-password: {{ include "udc.secretValue" (dict "ctx" . "key" "admin-password" "value" .Values.auth.adminPassword) | quote }}
  db-password: {{ include "udc.secretValue" (dict "ctx" . "key" "db-password" "value" .Values.database.password) | quote }}
{{- end }}
