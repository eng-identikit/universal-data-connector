{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "udc.fullname" . }}-secrets
  labels: {{- include "udc.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwt-secret: {{ include "udc.secretValue" (dict "ctx" . "key" "jwt-secret" "value" .Values.auth.jwtSecret) | quote }}
  admin-password: {{ include "udc.secretValue" (dict "ctx" . "key" "admin-password" "value" .Values.auth.adminPassword) | quote }}
  db-password: {{ include "udc.secretValue" (dict "ctx" . "key" "db-password" "value" .Values.database.password) | quote }}
  # Service key the orchestrator (ui-api) uses on this UDC
  service-key: {{ include "udc.secretValue" (dict "ctx" . "key" "service-key" "value" .Values.auth.serviceKey "prefix" "udc_") | quote }}
  ui-jwt-secret: {{ include "udc.secretValue" (dict "ctx" . "key" "ui-jwt-secret" "value" .Values.uiApi.jwtSecret) | quote }}
  ui-encryption-key: {{ include "udc.secretValue" (dict "ctx" . "key" "ui-encryption-key" "value" .Values.uiApi.encryptionKey) | quote }}
  ui-admin-password: {{ include "udc.secretValue" (dict "ctx" . "key" "ui-admin-password" "value" .Values.uiApi.adminPassword) | quote }}
{{- end }}
