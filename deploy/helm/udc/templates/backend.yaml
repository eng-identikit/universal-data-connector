{{- if and (not .Values.nats.enabled) (gt (int .Values.backend.replicas) 1) }}
{{- fail "backend.replicas > 1 needs NATS (nats.enabled=true)" }}
{{- end }}
{{- if and (not .Values.nats.enabled) .Values.backend.edgePools }}
{{- fail "backend.edgePools need NATS (nats.enabled=true): pools share connectors through the cluster" }}
{{- end }}
{{- /* The main pool: behind the Service, answers the API */}}
{{- include "udc.backendDeployment" (dict "root" . "pool" .Values.backend "component" "backend" "suffix" "backend") }}
{{- /* Edge pools: replicas that reach what the others cannot (serial ports, fieldbus
       segments, broadcast/multicast networks). Same cluster, not behind the Service;
       sources with placement: [<label>] run only on pools having that label. */}}
{{- $inherit := pick .Values.backend "image" "resources" "logLevel" "rawStorage" "historyRetention" "extraEnv" "podSecurityContext" "securityContext" "terminationGracePeriodSeconds" "shutdownDelaySeconds" }}
{{- range $pool := .Values.backend.edgePools }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$" (toString $pool.name)) }}
{{- fail (printf "backend.edgePools: invalid name %q (lowercase letters, digits, '-', up to 20)" (toString $pool.name)) }}
{{- end }}
---
{{- $merged := mergeOverwrite (deepCopy $inherit) (deepCopy $pool) }}
{{- include "udc.backendDeployment" (dict "root" $ "pool" $merged "component" (printf "backend-%s" $pool.name) "suffix" (printf "backend-%s" $pool.name)) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-backend
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "udc.fullname" . }}-backend
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend

{{- define "udc.backendDeployment" -}}
{{- $root := .root -}}
{{- $v := $root.Values -}}
{{- $p := .pool -}}
{{- $privileged := $p.privileged | default false -}}
{{- $root_user := or $privileged (not (empty $p.capabilities)) -}}
{{- $opcua := $v.backend.opcua | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" $root }}-{{ .suffix }}
  labels: {{- include "udc.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .component }}
spec:
  replicas: {{ $p.replicas | default 1 }}
  selector:
    matchLabels: {{- include "udc.selector" $root | nindent 6 }}
      app.kubernetes.io/component: {{ .component }}
  template:
    metadata:
      labels: {{- include "udc.selector" $root | nindent 8 }}
        app.kubernetes.io/component: {{ .component }}
    spec:
      # Drain delay + requests in progress + connector stop + lease handover (see server.js stop)
      terminationGracePeriodSeconds: {{ $p.terminationGracePeriodSeconds | default 30 }}
      {{- if $p.hostNetwork }}
      # Broadcast/multicast/layer-2 protocols (BACnet discovery, DDS, Profinet DCP, EtherCAT)
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        {{- if $root_user }}
        # Raw sockets and host devices: the capabilities are effective only for root
        runAsUser: 0
        runAsNonRoot: false
        {{- else }}
        {{- toYaml $p.podSecurityContext | nindent 8 }}
        {{- end }}
      {{- if $opcua.trustedSecret }}
      initContainers:
        # Server certificates trusted by the OPC UA client, copied into the writable PKI
        - name: opcua-trust
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /app/certificates/trusted/certs && cp -L /opcua-trusted/* /app/certificates/trusted/certs/"]
          securityContext: {{- toYaml $p.securityContext | nindent 12 }}
          volumeMounts:
            - name: certificates
              mountPath: /app/certificates
            - name: opcua-trusted
              mountPath: /opcua-trusted
              readOnly: true
      {{- end }}
      containers:
        - name: backend
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- if $v.nats.enabled }}
            - name: BROKER_CLUSTER
              value: "true"
            {{- end }}
            # Sources, mapping and transformers live in the database: the config volume is ephemeral
            - name: BROKER_CONFIG_SYNC
              value: "true"
            {{- with $p.labels }}
            - name: UDC_INSTANCE_LABELS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: BROKER_DB_HOST
              value: {{ include "udc.dbHost" $root | quote }}
            - name: BROKER_DB_PORT
              value: {{ $v.database.port | quote }}
            - name: BROKER_DB_NAME
              value: {{ $v.database.name | quote }}
            - name: BROKER_DB_USER
              value: {{ $v.database.user | quote }}
            - name: BROKER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" $root }}, key: db-password } }
            - name: BROKER_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" $root }}, key: jwt-secret } }
            - name: BROKER_ADMIN_USER
              value: {{ $v.auth.adminUser | quote }}
            - name: BROKER_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" $root }}, key: admin-password } }
            - name: BROKER_SERVICE_KEY
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" $root }}, key: service-key } }
            {{- if $v.nats.enabled }}
            - name: NATS_URL
              value: {{ include "udc.natsUrl" $root | quote }}
            {{- end }}
            - name: UDC_RAW_STORAGE
              value: {{ $p.rawStorage | quote }}
            - name: BROKER_HISTORY_RETENTION
              value: {{ $p.historyRetention | quote }}
            - name: LOG_LEVEL
              value: {{ $p.logLevel | quote }}
            # stdout only: the container runtime collects it
            - name: LOG_FILE
              value: "false"
            - name: UDC_SHUTDOWN_DELAY_MS
              value: {{ mul (int ($p.shutdownDelaySeconds | default 0)) 1000 | quote }}
            - name: OPCUA_APPLICATION_URI
              value: {{ $opcua.applicationUri | default "urn:udc:Universal-Data-Connector" | quote }}
            {{- if $opcua.existingSecret }}
            - name: OPCUA_CERTIFICATE_FILE
              value: /app/opcua-identity/certificate.pem
            - name: OPCUA_PRIVATE_KEY_FILE
              value: /app/opcua-identity/private_key.pem
            {{- end }}
            {{- if $v.redis.enabled }}
            - name: BROKER_REDIS_URL
              value: {{ include "udc.redisUrl" $root | quote }}
            {{- end }}
            {{- with include "udc.mqttUrl" $root }}
            - name: BROKER_MQTT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Slow first start (migrations, database not yet up) without liveness restarts
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources: {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- if $privileged }}
            privileged: true
            {{- else }}
            {{- $sc := deepCopy $p.securityContext }}
            {{- if $p.capabilities }}
            {{- $_ := set $sc "capabilities" (dict "drop" (list "ALL") "add" $p.capabilities) }}
            {{- end }}
            {{- toYaml $sc | nindent 12 }}
            {{- end }}
          volumeMounts:
            # Written at runtime; the copy that counts is in the database (ConfigSync)
            - name: config
              mountPath: /app/config
            # OPC UA PKI: trusted/rejected server certificates, generated identity
            - name: certificates
              mountPath: /app/certificates
            - name: tmp
              mountPath: /tmp
            {{- if $opcua.existingSecret }}
            - name: opcua-identity
              mountPath: /app/opcua-identity
              readOnly: true
            {{- end }}
            {{- range $p.devices }}
            - name: dev-{{ base . | lower | replace "_" "-" }}
              mountPath: {{ . }}
            {{- end }}
      volumes:
        - name: config
          emptyDir: {}
        - name: certificates
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $opcua.existingSecret }}
        - name: opcua-identity
          secret:
            secretName: {{ $opcua.existingSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if $opcua.trustedSecret }}
        - name: opcua-trusted
          secret:
            secretName: {{ $opcua.trustedSecret }}
        {{- end }}
        {{- range $p.devices }}
        - name: dev-{{ base . | lower | replace "_" "-" }}
          hostPath:
            path: {{ . }}
            type: CharDevice
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
