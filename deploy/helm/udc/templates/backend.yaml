apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" . }}-backend
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ if or .Values.nats.enabled (le (int .Values.backend.replicas) 1) }}{{ .Values.backend.replicas }}{{ else }}{{ fail "backend.replicas > 1 needs NATS (nats.enabled=true)" }}{{ end }}
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      # Graceful stop hands leases over immediately (see ClusterCoordinator.stop)
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- if .Values.nats.enabled }}
            - name: BROKER_CLUSTER
              value: "true"
            {{- end }}
            - name: BROKER_DB_HOST
              value: {{ include "udc.dbHost" . | quote }}
            - name: BROKER_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: BROKER_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: BROKER_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: BROKER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: db-password } }
            - name: BROKER_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: jwt-secret } }
            - name: BROKER_ADMIN_USER
              value: {{ .Values.auth.adminUser | quote }}
            - name: BROKER_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: admin-password } }
            {{- if .Values.nats.enabled }}
            - name: NATS_URL
              value: {{ include "udc.natsUrl" . | quote }}
            {{- end }}
            - name: UDC_RAW_STORAGE
              value: {{ .Values.backend.rawStorage | quote }}
            - name: BROKER_HISTORY_RETENTION
              value: {{ .Values.backend.historyRetention | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            {{- if .Values.redis.enabled }}
            - name: BROKER_REDIS_URL
              value: {{ include "udc.redisUrl" . | quote }}
            {{- end }}
            {{- with include "udc.mqttUrl" . }}
            - name: BROKER_MQTT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # Connector config files: shared between replicas through the database (ConfigSync)
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-backend
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "udc.fullname" . }}-backend
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: backend
