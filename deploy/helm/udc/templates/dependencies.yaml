{{- /* Bundled PostgreSQL (TimescaleDB + PostGIS) and NATS JetStream for single-cluster installs */ -}}
{{- if .Values.database.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "udc.fullname" . }}-db
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "udc.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "udc.secretName" . }}, key: db-password } }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/postgres/pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-db
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
---
{{- if and .Values.nats.enabled .Values.nats.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "udc.fullname" . }}-nats
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "udc.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.nats.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-nats
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
{{- end }}
{{- if .Values.mqtt.bundled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" . }}-mqtt
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: mqtt
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: mqtt
    spec:
      containers:
        - name: mqtt
          image: {{ .Values.mqtt.image }}
          args: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          readinessProbe:
            tcpSocket: { port: mqtt }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-mqtt
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
{{- end }}
{{- if and .Values.redis.enabled .Values.redis.bundled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "udc.fullname" . }}-redis
  labels: {{- include "udc.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "udc.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels: {{- include "udc.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Sessions are short-lived: losing them on a restart only means logging in again
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket: { port: redis }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "udc.fullname" . }}-redis
  labels: {{- include "udc.labels" . | nindent 4 }}
spec:
  selector: {{- include "udc.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
