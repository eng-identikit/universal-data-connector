# Universal Data Connector Helm values.
# Minimal install (bundled PostgreSQL and NATS, secrets generated on first install):
#   helm install udc deploy/helm/udc
# Production: point database/nats to managed services and set the secrets explicitly.

backend:
  image:
    repository: udc/backend
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  # The only component with N replicas: one UDC split across them through leases
  # (connectors, subscription partitions, ingest). The UI and the ui-api always run as one
  # instance and see all the replicas as a single UDC through the backend Service.
  replicas: 2
  logLevel: info
  # Raw connector data buffer: memory (entity history lives in the broker database)
  rawStorage: memory
  historyRetention: "90 days"
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 1Gi }
  podDisruptionBudget:
    minAvailable: 1
  # Extra environment variables, e.g. BROKER_INGEST_FLUSH_MS
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Graceful stop: after SIGTERM the pod keeps serving for shutdownDelaySeconds (readiness
  # already 503) while the Service stops sending it traffic, then finishes the requests in
  # progress, stops its connectors and hands its leases over
  shutdownDelaySeconds: 5
  terminationGracePeriodSeconds: 30

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000          # "node" in the image
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true   # writable: /app/config, /app/certificates, /tmp (emptyDir)
    capabilities: { drop: [ALL] }

  # Labels of these replicas (UDC_INSTANCE_LABELS). A source with placement: [<label>, ...]
  # runs only on replicas having all those labels (see edgePools)
  labels: []

  # Network and hardware access of the main pool; usually left off here and set on an
  # edge pool instead (see below)
  hostNetwork: false
  privileged: false
  capabilities: []
  devices: []

  # OPC UA client identity. Without existingSecret every pod generates its own self-signed
  # certificate at start: OPC UA servers with security would have to trust each new one.
  # Shared identity (same certificate on every replica, trusted once):
  #   node src/tools/opcua-certificate.js ./opcua --uri urn:udc:Universal-Data-Connector
  #   kubectl create secret generic udc-opcua --from-file=./opcua/certificate.pem --from-file=./opcua/private_key.pem
  opcua:
    applicationUri: "urn:udc:Universal-Data-Connector"
    # Secret with certificate.pem and private_key.pem
    existingSecret: ""
    # Secret with the OPC UA server certificates to trust (any file names, PEM or DER)
    trustedSecret: ""

  # Edge pools: replicas that reach what a normal pod cannot (serial ports, a fieldbus
  # segment, BACnet broadcast, DDS multicast, Profinet DCP / EtherCAT raw frames).
  # They join the same cluster (NATS required), are not behind the Service, and run only
  # the sources whose placement they match. Image, resources, logLevel, extraEnv and the
  # security contexts are inherited from backend unless set here.
  #   hostNetwork  the node's network: broadcast and multicast reach the plant network
  #                (port 3000 is then taken on the node: one replica per node)
  #   devices      host character devices mounted at the same path (serial ports); they
  #                need privileged: true or a device plugin
  #   privileged / capabilities (e.g. [NET_RAW, NET_ADMIN] for raw frames) run as root
  edgePools: []
  #  - name: serial
  #    replicas: 1
  #    labels: [serial]
  #    nodeSelector: { udc.io/serial: "true" }
  #    devices: [/dev/ttyUSB0]
  #    privileged: true
  #  - name: fieldbus
  #    replicas: 1
  #    labels: [fieldbus]
  #    hostNetwork: true
  #    capabilities: [NET_RAW, NET_ADMIN]
  #    nodeSelector: { udc.io/plant-network: "true" }

ui:
  enabled: true
  image:
    repository: udc/ui
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  # Always one instance
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

# Orchestrator API (universal-data-connector-ui-api), deployed with the UI
uiApi:
  image:
    repository: udc/ui-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  # Always one instance (Recreate on upgrades)
  # Its own database on the same PostgreSQL (created on first start)
  dbName: udc_ui
  adminUser: admin
  # Generated when empty (kept on upgrades)
  adminPassword: ""
  jwtSecret: ""
  encryptionKey: ""
  # Address external clients use for this UDC (MCP); defaults to https://<ingress.apiHost>
  udcPublicUrl: ""
  keycloak:
    url: ""
    realm: ""
    clientId: ""
    uiClientId: ""
    authorizedRole: ""
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

service:
  type: ClusterIP
  backendPort: 3000
  uiPort: 80
  uiApiPort: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The UI (orchestrator)
  host: udc.example.local
  # The UDC API for devices, scripts and MCP clients (optional)
  apiHost: ""
  tls: []
  #  - secretName: udc-tls
  #    hosts: [udc.example.local]

auth:
  adminUser: admin
  # Leave empty to generate on first install (kept on upgrades); or use existingSecret
  adminPassword: ""
  jwtSecret: ""
  # Service key of the orchestrator on this UDC (udc_ + 20 or more characters); generated when empty
  serviceKey: ""
  # Secret with keys: jwt-secret, admin-password, db-password, service-key,
  # ui-jwt-secret, ui-encryption-key, ui-admin-password
  existingSecret: ""

database:
  # bundled: PostgreSQL with TimescaleDB + PostGIS in this release
  bundled: true
  host: ""
  port: 5432
  name: udc_broker
  user: udc
  password: ""
  image: timescale/timescaledb-ha:pg16
  storage: 20Gi
  storageClass: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }

nats:
  # false: no NATS at all. The backend then runs a single replica with in-memory
  # queues (pending notifications are lost on restart) and no NATS channel default.
  enabled: true
  bundled: true
  # external: nats://nats.example:4222
  url: ""
  image: nats:2.10-alpine
  storage: 10Gi
  storageClass: ""

mqtt:
  # Default broker for MQTT notification channels (optional): a bundled Mosquitto
  # or an external url. Without either, MQTT subscriptions must set notify.url.
  bundled: false
  url: ""
  image: eclipse-mosquitto:2

redis:
  # Login sessions behind the JWTs and shared login attempt limits. Without it
  # sessions are kept in PostgreSQL (works, one more query per request).
  enabled: true
  bundled: true
  # external: redis://:password@redis.example:6379
  url: ""
  image: redis:7-alpine
