# UDC Broker stack: PostgreSQL (TimescaleDB + PostGIS), backend, UI and two optional services:
#   nats  NATS JetStream: durable notification/ingest queues, clustering, NATS channel
#   mqtt  Mosquitto: default broker for MQTT notification channels and MQTT connectors
#   redis Redis: login sessions (JWT) and login attempt limits shared by all instances
# Pick them with COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=nats,mqtt,redis or empty), then:
#   docker compose up -d --build
# UI: http://localhost:8080   API: http://localhost:3000/api/v1
# Credentials and secrets come from .env (see .env.example).

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${BROKER_DB_USER:-udc}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD:-udc-dev-password}
      POSTGRES_DB: ${BROKER_DB_NAME:-udc_broker}
    volumes:
      - db-data:/home/postgres/pgdata/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nats:
    profiles: [nats]
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  # MQTT broker for notification channels and MQTT connectors
  mqtt:
    profiles: [mqtt]
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
    restart: unless-stopped

  # Login sessions behind the JWTs; without it they are kept in PostgreSQL
  redis:
    profiles: [redis]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  udc:
    build: .
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
        required: false
      mqtt:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
    environment:
      BROKER_DB_HOST: db
      BROKER_DB_PORT: 5432
      BROKER_DB_USER: ${BROKER_DB_USER:-udc}
      BROKER_DB_PASSWORD: ${BROKER_DB_PASSWORD:-udc-dev-password}
      BROKER_DB_NAME: ${BROKER_DB_NAME:-udc_broker}
      BROKER_JWT_SECRET: ${BROKER_JWT_SECRET:?set BROKER_JWT_SECRET in .env}
      BROKER_ADMIN_USER: ${BROKER_ADMIN_USER:-admin}
      BROKER_ADMIN_PASSWORD: ${BROKER_ADMIN_PASSWORD:?set BROKER_ADMIN_PASSWORD in .env}
      # Service key the orchestrator (ui-api) uses to configure this instance
      BROKER_SERVICE_KEY: ${BROKER_SERVICE_KEY:-}
      # Empty = not used. Point them to the bundled services (nats://nats:4222,
      # mqtt://mqtt:1883) or to external ones.
      NATS_URL: ${COMPOSE_NATS_URL:-}
      BROKER_MQTT_URL: ${COMPOSE_MQTT_URL:-}
      BROKER_REDIS_URL: ${COMPOSE_REDIS_URL:-}
      # Raw connector data buffer; entity history is stored by the broker in TimescaleDB
      UDC_RAW_STORAGE: ${UDC_RAW_STORAGE:-memory}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./config:/app/config
      - udc-logs:/app/logs
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Backend for frontend: catalog of UDC instances, board layout, UI users
  ui-api:
    build: ../universal-data-connector-ui-api
    depends_on:
      db:
        condition: service_healthy
      udc:
        condition: service_started
    environment:
      UI_DB_HOST: db
      UI_DB_USER: ${BROKER_DB_USER:-udc}
      UI_DB_PASSWORD: ${BROKER_DB_PASSWORD:-udc-dev-password}
      UI_DB_NAME: ${UI_DB_NAME:-udc_ui}
      UI_JWT_SECRET: ${UI_JWT_SECRET:?set UI_JWT_SECRET in .env}
      UI_ENCRYPTION_KEY: ${UI_ENCRYPTION_KEY:?set UI_ENCRYPTION_KEY in .env}
      UI_ADMIN_USER: ${UI_ADMIN_USER:-admin}
      UI_ADMIN_PASSWORD: ${UI_ADMIN_PASSWORD:-}
      # The UDC of this stack, registered on the first start
      UDC_DEFAULT_NAME: ${UDC_DEFAULT_NAME:-UDC}
      UDC_DEFAULT_URL: http://udc:3000
      UDC_DEFAULT_PUBLIC_URL: ${UDC_PUBLIC_URL:-http://localhost:3000}
      UDC_DEFAULT_KEY: ${BROKER_SERVICE_KEY:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT: ${KEYCLOAK_CLIENT:-}
      KEYCLOAK_UI_CLIENT: ${KEYCLOAK_UI_CLIENT:-}
      KEYCLOAK_AUTHORIZED_ROLE: ${KEYCLOAK_AUTHORIZED_ROLE:-}
    ports:
      - "${UI_API_PORT:-9000}:9000"
    restart: unless-stopped

  # Orchestrator UI: talks only to ui-api (nginx proxies /api to it)
  ui:
    build: ../universal-data-connector-ui
    depends_on:
      - ui-api
    ports:
      - "${UI_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
  nats-data:
  redis-data:
  udc-logs:
