# UDC Broker stack: PostgreSQL (TimescaleDB + PostGIS), backend, UI and two optional services:
#   nats  NATS JetStream: durable notification/ingest queues, clustering, NATS channel
#   mqtt  Mosquitto: default broker for MQTT notification channels and MQTT connectors
# Pick them with COMPOSE_PROFILES in .env (e.g. COMPOSE_PROFILES=nats,mqtt or empty), then:
#   docker compose up -d --build
# UI: http://localhost:8080   API: http://localhost:3000/api/v1
# Credentials and secrets come from .env (see .env.example).

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${BROKER_DB_USER:-udc}
      POSTGRES_PASSWORD: ${BROKER_DB_PASSWORD:-udc-dev-password}
      POSTGRES_DB: ${BROKER_DB_NAME:-udc_broker}
    volumes:
      - db-data:/home/postgres/pgdata/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nats:
    profiles: [nats]
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  # MQTT broker for notification channels and MQTT connectors
  mqtt:
    profiles: [mqtt]
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
    restart: unless-stopped

  udc:
    build: .
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
        required: false
      mqtt:
        condition: service_started
        required: false
    environment:
      BROKER_DB_HOST: db
      BROKER_DB_PORT: 5432
      BROKER_DB_USER: ${BROKER_DB_USER:-udc}
      BROKER_DB_PASSWORD: ${BROKER_DB_PASSWORD:-udc-dev-password}
      BROKER_DB_NAME: ${BROKER_DB_NAME:-udc_broker}
      BROKER_JWT_SECRET: ${BROKER_JWT_SECRET:?set BROKER_JWT_SECRET in .env}
      BROKER_ADMIN_USER: ${BROKER_ADMIN_USER:-admin}
      BROKER_ADMIN_PASSWORD: ${BROKER_ADMIN_PASSWORD:?set BROKER_ADMIN_PASSWORD in .env}
      # Empty = not used. Point them to the bundled services (nats://nats:4222,
      # mqtt://mqtt:1883) or to external ones.
      NATS_URL: ${COMPOSE_NATS_URL:-}
      BROKER_MQTT_URL: ${COMPOSE_MQTT_URL:-}
      # Raw connector data buffer; entity history is stored by the broker in TimescaleDB
      UDC_RAW_STORAGE: ${UDC_RAW_STORAGE:-memory}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./config:/app/config
      - udc-logs:/app/logs
    ports:
      - "3000:3000"
    restart: unless-stopped

  ui:
    build: ../universal-data-connector-ui
    depends_on:
      - udc
    ports:
      - "${UI_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
  nats-data:
  udc-logs:
